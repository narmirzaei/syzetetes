# The default referee, spelled out. Jev (TypeSafe AI) judges every claim after every round: status, who moved,
# repetition, kind of crux, whose case is stronger, whether you are needed, each with a confidence. A small
# LLM scribe writes the words around those verdicts and cannot change them. Needs $TYPESAFE_API_KEY.
topic = "Is sub-replacement fertility a serious problem, or is the pension 'Ponzi' concern a fixable design flaw?"

[models]
referee = "jev"
judge_model = "jev-latest"
scribe = "claude"
referee_model = "haiku"
referee_effort = "low"

[debate]
max_rounds = 4
pause_on = ["referee", "stall", "low_confidence"]   # also stop when Jev is unsure about a status
