[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syzetetes"
version = "0.1.0"
description = "Two AI models (Claude and Codex) research a question, debate it in structured rounds under a referee, and hand you a referenced report."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
syzetetes = "syzetetes.cli:main"

[tool.setuptools.packages.find]
include = ["syzetetes*"]
